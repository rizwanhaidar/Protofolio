<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Portfolio responsive review</title><style>body{margin:0;background:#ddd;font:14px system-ui}.controls{padding:12px;display:flex;gap:16px;flex-wrap:wrap;background:white}label{display:flex;gap:8px;align-items:center}select{padding:8px}iframe{border:0;display:block;background:white}#summary{padding:8px}body:has(option[value="1440"]:checked){min-width:1440px}</style></head><body><div class="controls"><label>Version<select id="version"><option value="after">After</option><option value="before">Before</option></select></label><label>Width<select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option><option>360</option></select></label><label>Page<select id="page"><option value="professional/">Professional</option><option value="academic/">Academic</option><option value="work/toyota/">Toyota</option><option value="work/volvo/">Volvo</option><option value="work/fcl/">FCL</option><option value="work/giz/">GIZ</option><option value="work/clinical/">Clinical</option><option value="work/xaihate/">XAIHate</option><option value="work/nli/">NLI</option><option value="work/polarization/">Polarization</option><option value="work/graph-aml/">Graph AML</option><option value="work/ai-safety/">AI Safety</option><option value="work/clinical-research/">Clinical research</option></select></label><button id="refresh">Refresh measurement</button></div><div id="summary" role="status"></div><iframe title="Portfolio review viewport" id="view"></iframe><script>
const frame=document.querySelector('iframe'),page=document.querySelector('#page'),width=document.querySelector('#width'),version=document.querySelector('#version');
function measure(){const d=frame.contentDocument;if(!d?.body)return;frame.style.height=d.documentElement.scrollHeight+'px';document.querySelector('#summary').textContent=`${version.value} · ${page.value} · CSS viewport ${frame.contentWindow.innerWidth}px · document ${d.documentElement.scrollWidth}px · height ${d.documentElement.scrollHeight}px`;}
function load(){frame.style.width=width.value+'px';frame.style.height='900px';frame.src='/Protofolio/preview/'+(version.value==='before'?'dual-profile/':'visual-review-final/')+page.value;}
frame.addEventListener('load',()=>{frame.contentDocument.querySelectorAll('img').forEach(i=>i.loading='eager');Promise.all([...frame.contentDocument.images].map(i=>i.decode().catch(()=>{}))).then(measure);frame.contentDocument.fonts.ready.then(measure)});[page,width,version].forEach(x=>x.addEventListener('change',load));document.querySelector('#refresh').onclick=measure;load();
</script></body></html>
